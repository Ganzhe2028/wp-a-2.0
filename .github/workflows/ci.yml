name: CI

on:
  pull_request:
  push:
    branches: [main, XuChen]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
      ANON_HMAC_SECRET: ci-only-anonymous-secret-with-at-least-32-bytes
      AUTH_MODE: LOCAL_ONLY
      APP_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:generated
      - run: npm run check:openapi
      - run: npm run build
      - run: npm run audit:harness
